[project]
name = "mondegreen"
version = "0.1.0"
description = "Does a small multilingual model tell you when it has misread your request? Silent misreadings of Hausa, Yoruba and Igbo prompts in Tiny Aya."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
judge = ["isoglot[judge] @ git+https://github.com/nftkingiii/isoglot"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
